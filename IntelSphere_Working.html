<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d121c"><title>IntelSphere AI · Working local app</title><style>:root{--bg:#0d121c;--panel:#141c29;--panel2:#182231;--border:#263143;--text:#ecf0f7;--muted:#a0adc0;--subtle:#8e9bb1;--purple:#b2a9fb;--green:#76dfbd;--red:#f09aa7;--amber:#e2c080;--blue:#9db8ff}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI",Inter,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit;transition:background .14s,border-color .14s}
a{color:inherit;text-decoration:none}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a5a0f0;outline-offset:3px}
button:active:not(:disabled){transform:translateY(1px)}
input,textarea,select{color:var(--text);accent-color:#a59df4}
h1,h2,h3,p{margin-top:0}
h2{font-size:16px;letter-spacing:-.3px;font-weight:600}
h3{font-size:15px}
svg{vertical-align:middle;flex-shrink:0}
.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:239px;background:#0a1019;border-right:1px solid #202a3a;padding:28px 17px 0;display:flex;flex-direction:column;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-size:22px;letter-spacing:-.8px;font-weight:650;padding:0 8px;margin-bottom:33px}
.logo-mark{display:flex;align-items:center;justify-content:center;color:#c0b8ff;background:#332d59;border:1px solid #514878;border-radius:10px;width:37px;height:37px}
.ai-tag{font-size:10px;letter-spacing:.2px;background:#29233f;color:#c2b6f9;padding:1px 5px;border:1px solid #463c63;border-radius:4px;align-self:flex-start;margin:5px 0 0 -3px}
.workspace{display:flex;align-items:center;gap:9px;padding:12px 10px;background:#141e2c;border:1px solid #263447;border-radius:8px;margin-bottom:29px}
.workspace-icon{color:#a9b8d1;background:#233149;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;flex-shrink:0}
.workspace>div{min-width:0}
.workspace strong{display:block;font-size:11px;color:#d6deeb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace small{font-size:7px;letter-spacing:.75px;color:#95a5bd;display:block;margin-top:4px}
.nav-caption{font-size:9px;letter-spacing:1.6px;color:#8291a8;padding:0 12px;margin-bottom:8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-bottom:5px;border:1px solid transparent;border-radius:6px;background:none;color:#a5b2c9;text-align:left;font-size:11px;font-weight:500;min-height:42px}
.nav-item:hover{background:#192234}
.nav-item.active{background:#292640;border-color:#423b62;color:#d3cafa}
.nav-item.active svg{color:#b4a5f6}
.nav-item span{flex:1}
.nav-item b{font-size:9px;font-weight:500;background:#3a3455;color:#c8b9fc;padding:1px 6px;border-radius:4px}
.sidebar-bottom{margin-top:auto;padding-top:35px}
.model-card{background:linear-gradient(130deg,#1c2136,#142830);border:1px solid #30414b;border-radius:8px;padding:16px 14px;margin:0 3px 21px;position:relative}
.model-dot{width:5px;height:5px;background:#7fddb9;display:inline-block;border-radius:50%;margin-right:6px;box-shadow:0 0 8px #7fddb933}
.model-card strong{font-size:11px;color:#c1dcd7}
.model-card p{font-size:10px;color:#9db6b8;line-height:1.9;margin:9px 0 13px}
.model-card button{border:0;background:none;padding:0;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:9px;color:#b3caca}
.profile{display:flex;align-items:center;gap:9px;border-top:1px solid #233044;padding:18px 4px;margin-top:15px}
.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#31394d;border:1px solid #4b566e;color:#bdc7e0;font-size:10px;font-weight:650}
.profile>div{flex:1}
.profile strong{font-size:11px;color:#d6dfef;display:block}
.profile small{display:block;font-size:9px;color:#8f9fb9;margin-top:2px}
.profile>svg{color:#7e92ad}
.main-shell{margin-left:239px;flex:1;min-width:0}
.topbar{height:69px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 36px;border-bottom:1px solid #232c3a;background:#101722}
.breadcrumbs{display:flex;align-items:center;gap:11px;font-size:10px;color:#95a2b7}
.breadcrumbs strong{font-weight:500;color:#b5c0d3}
.breadcrumbs svg{color:#6e8099}
.top-actions{display:flex;align-items:center;gap:16px}
.save-label{font-size:9px;color:#8fa3b8}
.avatar.small{width:29px;height:29px;font-size:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;min-height:37px;font-size:11px;font-weight:500;border:1px solid #354256;background:#1b2636;color:#c4d0e2;border-radius:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:#253247;border-color:#4b5a73}
.btn.primary{color:#f8f7ff;background:#7464d6;border-color:#8f7fe7;box-shadow:0 3px 10px #554ba222}
.btn.primary:hover:not(:disabled){background:#8371e3}
.btn.small{font-size:10px;min-height:30px;padding:6px 10px}
.btn.wide{width:100%}
.main{max-width:1570px;margin:auto;padding:30px 36px 0}
.heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:21px}
.eyebrow{font-size:8px;letter-spacing:1.7px;color:#8f9bb3;font-weight:650;margin-bottom:7px}
h1{font-size:27px;line-height:1.4;letter-spacing:-.8px;font-weight:600;margin-bottom:5px}
.heading p{font-size:11px;color:#94a4ba;margin-bottom:0}
.heading-actions{display:flex;gap:8px}
.truth-strip{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid #283346;background:#141d2c;border-radius:6px;padding:10px 12px;font-size:9px;margin-bottom:18px}
.truth-strip>div{display:flex;align-items:center;gap:10px}
.truth-strip>div>span:last-child{color:#9cabc1}
.truth-strip button{display:flex;align-items:center;gap:5px;color:#a9b6cc;font-size:9px;border:0;background:none;white-space:nowrap}
.badge{font-size:8px;padding:3px 7px;background:#263144;border:1px solid #39485f;color:#c0cee0;border-radius:4px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;line-height:1.4;font-weight:550}
.badge.green{background:#17352f;border-color:#285347;color:#91ddc2}
.badge.red{background:#38232e;border-color:#5f3547;color:#f1a5b7}
.badge.amber{background:#342e23;border-color:#514633;color:#e1c891}
.badge.blue{background:#202e47;border-color:#354a6e;color:#afc6f7}
.badge.purple{background:#302940;border-color:#4e416c;color:#c3b2f5}
.filter-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.filter-control{display:flex;align-items:center;gap:5px;border:1px solid #2c394d;background:#141e2c;border-radius:5px;padding:6px 9px;color:#a0b0ca;min-height:32px}
.filter-control select{appearance:auto;background:transparent;border:0;font-size:10px;max-width:155px;outline:0}
.filter-control select option,select option{background:#182333}
.date-filter{display:flex;align-items:center;gap:5px;color:#9caac2;font-size:9px;border:1px solid #2c394d;background:#141e2c;padding:5px 8px;border-radius:5px;min-height:32px}
.date-filter input{border:0;outline:0;background:transparent;font-size:9px;color:#b0bfd7;color-scheme:dark;max-width:112px}
.cohort-count{margin-left:auto;font-size:9px;color:#94a5be;white-space:nowrap}
.text-link{border:0;background:transparent;color:#b9aff0;display:inline-flex;align-items:center;gap:6px;padding:0;font-size:10px;white-space:nowrap}
.text-link:hover{text-decoration:underline}
.insight-banner{display:flex;align-items:center;justify-content:space-between;gap:30px;background:linear-gradient(110deg,#27243d 0%,#20263c 45%,#192b37 100%);border:1px solid #3c3b55;border-radius:10px;padding:26px 31px;min-height:245px;margin-bottom:20px;position:relative;overflow:hidden}
.insight-banner:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;border:1px solid #455165;right:-170px;bottom:-170px;box-shadow:0 0 0 40px #35435726,0 0 0 80px #35435716;pointer-events:none}
.banner-label{display:flex;align-items:center;gap:7px;font-size:8px;letter-spacing:1.3px;color:#bbb0e6;font-weight:600}
.insight-banner h2{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:12px 0;color:#eeeaf9;font-weight:550}
.insight-banner p{font-size:11px;color:#a7acc7;line-height:1.8;margin-bottom:17px}
.insight-banner .text-link{font-size:10px;color:#d1c4fd}
.signal-visual{width:340px;flex-shrink:0;z-index:1;margin-right:25px}
.signal-source,.signal-ai,.signal-result{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#1c2537;border:1px solid #3f4c62;border-radius:7px;width:280px;box-shadow:0 7px 18px #00000015}
.signal-source{transform:rotate(-2deg)}
.signal-source svg{color:#a5b6d5}
.signal-ai{margin-left:29px;background:#302d4e;border-color:#68608d}
.signal-ai svg{color:#c1b4ff}
.signal-result{margin-left:8px;transform:rotate(1deg);background:#203a3e;border-color:#3a5c5e}
.signal-result svg{color:#92d3c1}
.signal-visual span{font-size:10px;color:#ccd3e6}
.signal-source b,.signal-result b{font-weight:500;font-size:10px;border-radius:4px;padding:2px 7px;background:#34425b;color:#bbcced;margin-left:auto}
.signal-result b{background:#2c534f;color:#aae4d0}
.signal-ai i{font-style:normal;font-size:7px;border-radius:4px;border:1px solid #796aa2;padding:1px 5px;margin-left:auto;color:#d0c0fb}
.signal-connector{height:12px;width:1px;margin-left:170px;background:#64718d}
.signal-caption{font-size:8px;color:#a1b7c3;display:flex;align-items:center;gap:5px;justify-content:center;margin-top:13px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.metric-card{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:17px 18px 15px}
.metric-card>div{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px}
.metric-card div>span{font-size:10px;color:#a6b4ca}
.metric-card i{display:grid;place-items:center;border-radius:6px;background:#29283f;width:29px;height:29px;color:#b2a7f7}
.metric-card i.green{background:#1b3530;color:#87cdb5}
.metric-card i.amber{background:#342e25;color:#c9b67c}
.metric-card i.blue{background:#1f304a;color:#93b3e7}
.metric-card>strong{font-size:29px;letter-spacing:-1px;font-weight:550;display:block;line-height:1.3;margin-bottom:8px}
.metric-card>small{font-size:9px;color:#99aac0;display:block;line-height:1.6}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.panel-head{padding:20px 21px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head h2{font-size:13px;margin:0;color:#dce3f0}
.panel-head p{font-size:10px;color:#94a5bc;margin:5px 0 0}
.chart-grid{display:grid;grid-template-columns:1fr 1.12fr;gap:20px;margin-bottom:20px}
.sentiment-body{display:flex;align-items:center;gap:20px;padding:0 22px 17px}
.donut{width:163px;height:163px;position:relative;flex-shrink:0}
.donut svg{width:100%;height:100%}
.donut>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
.donut strong{font-size:28px;line-height:1.3;font-weight:550;letter-spacing:-.7px}
.donut span{font-size:9px;color:#9baec8}
.sentiment-legend{flex:1;min-width:110px}
.sentiment-legend>div{display:flex;align-items:center;gap:12px;font-size:10px;padding:7px 0;border-bottom:1px solid #263143}
.sentiment-legend>div:last-child{border:0}
.sentiment-legend span{display:flex;align-items:center;gap:7px;flex:1;color:#b8c5d8}
.sentiment-legend strong{font-size:10px;font-weight:500}
.sentiment-legend small{font-size:9px;color:#8fa3bd;min-width:25px;text-align:right}
.sentiment-dot{width:5px;height:5px;display:inline-block;border-radius:50%;background:#829cf6}
.sentiment-dot.positive{background:#64d5b0}
.sentiment-dot.negative{background:#ed8c98}
.sentiment-dot.uncertain{background:#d9b675}
.chart-note{font-size:9px;color:#93a7c0;padding:12px 21px;border-top:1px solid #283448;background:#121c2a;line-height:1.8}
.theme-bars{padding:0 22px 15px}

.theme-bar-row{display:block;width:100%;border:0;background:transparent;text-align:left;padding:0;margin:0 0 13px}
.theme-bar-row>div{display:flex;justify-content:space-between;font-size:10px;color:#b1bfd4;margin-bottom:5px}
.theme-bar-row strong{font-weight:500;color:#b7acf3}
.theme-bar-row svg{height:5px;width:100%;display:block}
.theme-bar-row:last-child{margin-bottom:0}
.overview-bottom{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start}
.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:left}
th{background:#111b29;color:#8da1bf;letter-spacing:.7px;font-size:8px;text-transform:uppercase;font-weight:550;padding:12px 18px;white-space:nowrap;border-top:1px solid #253246;border-bottom:1px solid #253246}
td{padding:14px 18px;border-bottom:1px solid #243044;font-size:10px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.review-cell{display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;width:100%;min-width:215px;max-width:600px}
.review-meta{font-size:8px;color:#91a8c9}
.review-meta i{font-style:normal;color:#6c809f;padding:0 4px}
.review-text{font-size:11px;line-height:1.75;color:#b6c3d8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.record-id{font:8px/1.6 "Cascadia Code",Consolas,monospace;letter-spacing:.2px;color:#8ca0bd;display:block}
.table-sub{display:block;color:#95a7c1;font-size:8px;margin-top:5px}
.theme-label{font-size:9px;color:#b1bfd4;white-space:normal}
.icon-btn{padding:5px;border:0;border-radius:4px;background:none;color:#9fb1ce;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#2a3750}
.opportunity-row{display:flex;align-items:center;gap:11px;border:0;border-top:1px solid #263246;width:100%;text-align:left;background:none;padding:18px 20px}
.opportunity-row:hover{background:#1b273a}
.rank{font:10px Consolas,monospace;color:#ac9ceb;background:#302946;border:1px solid #483e64;padding:6px;border-radius:5px;flex-shrink:0}
.opportunity-row>div{flex:1}
.opportunity-row strong{font-size:11px;color:#c9d3e5;font-weight:500;display:block;line-height:1.6}
.opportunity-row small{display:block;font-size:9px;color:#97a8c5;margin-top:6px}
.opportunity-row>svg{color:#a091d5}
.assumption-note{padding:15px 20px;background:#171f30;border-top:1px solid #29344b;display:flex;align-items:flex-start;gap:7px;color:#98a9c7;font-size:9px;line-height:1.9}
.assumption-note svg{color:#b2a2e7;margin-top:2px}
footer{margin-top:28px;padding:21px 0;border-top:1px solid #243146;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:#91a4bf;font-size:9px}
footer>span:first-child{display:flex;align-items:center;gap:6px}
footer i{font-style:normal;color:#5c718e}
footer button{border:0;background:none;padding:0;font-size:9px;color:#b8b1e1}
.alert{padding:12px;border:1px solid #594b35;background:#302a21;color:#e0c79b;border-radius:6px;display:flex;align-items:flex-start;gap:9px;font-size:11px;line-height:1.8;margin-bottom:17px}
.alert>span{flex:1}
.alert.error{background:#38242b;border-color:#69404b;color:#f0b3be}
.alert>button{border:0;background:none;display:flex;padding:0;color:inherit}
.toast{position:fixed;right:25px;bottom:25px;z-index:90;background:#244a40;border:1px solid #477769;color:#d9f2e9;box-shadow:0 8px 25px #0007;padding:13px 18px;border-radius:8px;font-size:12px;max-width:calc(100% - 40px);display:flex;align-items:center;gap:8px}
.explorer-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.search{display:flex;align-items:center;gap:7px;background:#141f30;border:1px solid #34435a;padding:9px 12px;border-radius:6px;color:#8ca4c5;flex:1}
.search input{font-size:11px;border:0;outline:0;background:none;width:100%}
.explorer-toolbar>select{padding:9px 11px;border:1px solid #34435a;border-radius:6px;background:#141f30;font-size:10px;max-width:190px}
.pagination{border-top:1px solid #28364c;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 20px;font-size:10px;color:#9bafcb}
.pagination>div{display:flex;gap:7px}
.sandbox{margin-top:22px}
.sandbox-body{padding:0 22px 22px}
.sandbox-result{padding:15px;border:1px solid #35475e;background:#1b293c;margin-top:16px;border-radius:6px}
.sandbox-result p{font-size:11px;color:#b0c0d8;margin:10px 0}
.sandbox-result small{font-size:10px;color:#93abc9}
.section-note{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border:1px solid #343650;border-radius:6px;background:#1a2032;color:#aab6d2;font-size:11px;line-height:1.9;margin-bottom:21px}
.section-note svg{color:#b1a1e8;margin-top:3px}
.opportunities-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.opportunity-card{padding:22px}
.opportunity-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.opportunity-card h2{font-size:19px;color:#dbe2f3;margin:0 0 10px;font-weight:550;line-height:1.45}
.opportunity-card>p{font-size:11px;color:#a0b2d0;line-height:1.9;margin-bottom:17px}
.evidence-quote{padding:13px;background:#1b2438;border-left:2px solid #746997;border-radius:0 5px 5px 0;font-size:11px;color:#bbc2dc;line-height:1.9}
.evidence-quote>span{display:block;font-size:9px;color:#9da8c9;margin-top:8px}
.rice-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #2b374f;padding:17px 0;margin-bottom:15px;gap:8px}
.rice-strip>div{display:flex;flex-direction:column;gap:6px}
.rice-strip span{font-size:8px;color:#96a6c4}
.rice-strip b{font-size:13px;font-weight:500;color:#bdc8df}
.opportunity-footer{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opportunity-footer>div{display:flex;align-items:center;gap:9px}
.opportunity-footer>div>span{font-size:8px;letter-spacing:1px;color:#a398c7}
.opportunity-footer strong{font-size:22px;font-weight:500;color:#c3b4f3}
.matrix{margin-top:22px}
.roadmap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.roadmap-card{padding:23px}
.roadmap-card h2{font-size:20px;line-height:1.5;margin:0 0 8px}
.roadmap-card>p{font-size:11px;color:#a0b0cb;margin-bottom:20px}
.draft-meta{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #283750;font-size:11px;color:#a2b5d2}
.draft-meta strong{font-weight:500;color:#bdcbe4}
.roadmap-actions{display:flex;gap:9px;margin-top:20px}
.import-hero{display:flex;align-items:center;gap:18px;background:#1e2940;border:1px solid #354767;padding:25px;border-radius:9px;margin-bottom:22px}
.import-hero>span{padding:16px;border:1px solid #524a77;border-radius:11px;background:#312e50;color:#c1b2f7}
.import-hero>div{flex:1}
.import-hero h2{font-size:21px;font-weight:550;margin:0 0 8px}
.import-hero p{font-size:11px;color:#a8b8d3;line-height:1.9;margin:0;max-width:680px}
.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-bottom:22px}
.source-card{padding:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.source-icon{width:37px;height:42px;border-radius:6px;display:grid;place-items:center;color:#b0acd8;background:#292b43;border:1px solid #454665}
.source-card>div{flex:1}
.source-card h2{font-size:13px;margin:0 0 4px}

 title="Inspect review evidence";body='<div class="modal-meta">'+badge(r.origin,r.origin==="Synthetic"?"amber":"blue")+'<span>'+h(r.competitor)+' · '+h(r.platform)+' · '+h(r.date||"Undated")+'</span></div><blockquote>'+h(r.text)+'</blockquote><div class="analysis-grid"><div><span>MODEL LABEL</span>'+badge(a.prediction.label,sentimentTone(a.prediction.label))+'</div><div><span>FINAL LABEL</span>'+badge(a.sentiment,sentimentTone(a.sentiment))+'</div><div><span>RATING</span><strong>'+(r.rating===null?"Not supplied":r.rating+" / 5")+'</strong></div></div><p class="micro">Vocabulary matched: '+a.prediction.known+' / '+a.prediction.total+' features. Influential model features: '+h(a.prediction.evidence.join(", ")||"Insufficient vocabulary")+'. These are model signals, not an explanation of the reviewer’s intent.</p><div class="detail-label">RULE-BASED THEMES</div><p>'+h(a.themes.map(t=>THEMES.find(x=>x.id===t).name).join(" · ")||"Uncategorized")+'</p>'+(a.switchPhrase?'<div class="alert">'+icon("alert",16)+'<span>Explicit switch-intent phrase: “'+h(a.switchPhrase)+'”. This is not a churn prediction.</span></div>':"")+'<label class="field">Human-reviewed sentiment<select data-field="reviewSentiment"><option value="">Use local model label</option>'+CLASSES.map(s=>'<option value="'+s+'" '+(form.reviewSentiment===s?"selected":"")+'>'+s+'</option>').join("")+'</select></label><label class="field">Review note<textarea rows="3" data-field="reviewNote" maxlength="2000" placeholder="Why did you keep or correct this label?">'+h(form.reviewNote)+'</textarea></label>'+(r.sourceURL?'<a class="source-link" href="'+h(r.sourceURL)+'" target="_blank" rel="noopener">Open original source '+icon("up",13)+'</a>':"")+'<span class="record-id">'+h(r.id)+(r.sourceId?" · source ID "+h(r.sourceId):"")+'</span>';foot=btn("Close","close")+btn("Save review judgment","save-review","check","primary");}
 if(modal==="opportunity"){
 const o=ops.find(o=>o.id===selectedTheme);if(!o)return "";title=o.title;body='<p class="muted">'+h(o.action)+'</p><div class="section-note">'+o.evidence.length+' supporting reviews in the current cohort. Quotes are evidence of reported concerns, not proof of competitor feature absence.</div><div class="evidence-list">'+o.evidence.slice(0,10).map(r=>'<button data-review="'+h(r.id)+'"><blockquote>'+h(r.text)+'</blockquote><span>'+h(r.competitor)+' · '+h(r.date||"Undated")+' · '+h(r.id)+' · '+h(r.origin)+'</span></button>').join("")+'</div>'+(o.evidence.length>10?'<p class="micro">Showing 10 of '+o.evidence.length+' evidence reviews. Use Review explorer for the complete cohort.</p>':"")+'<div class="detail-label">RICE ASSUMPTIONS</div><div class="three-fields"><label class="field">Impact (0–3)<input type="number" data-field="impact" min="0" max="3" step="0.25" value="'+form.impact+'"></label><label class="field">Analyst confidence (0–1)<input type="number" data-field="confidence" min="0" max="1" step="0.05" value="'+form.confidence+'"></label><label class="field">Effort (person-weeks)<input type="number" data-field="effort" min="0.1" max="100" step="0.1" value="'+form.effort+'"></label></div><p class="micro">Reach is fixed to '+o.evidence.length+' supporting reviews. The other inputs are your assumptions; confidence is not a model probability.</p><div id="rice-preview" class="rice-preview">Score: '+riceScore({reach:o.evidence.length,impact:Number(form.impact),confidence:Number(form.confidence),effort:Number(form.effort)}).toFixed(2)+'</div>';foot=btn("Close","close")+btn("Save scoring","save-rice","","")+btn("Add discovery brief","add-roadmap","plus","primary",w.roadmap.some(s=>s.themeId===o.id)?"disabled":"");}
 if(modal==="draft"){
 const s=w.roadmap.find(s=>s.id===selectedDraft);if(!s)return "";title=s.title;body=(staleSnapshot(w,s)?'<div class="alert">'+icon("alert",16)+'<span>Underlying evidence or RICE settings changed. This draft preserves its original snapshot. Compare it with current opportunities before using it.</span></div>':"")+'<div class="two-fields"><label class="field">Stage<select data-field="draftStage">'+["Discovery","Validated","Planned","Deferred"].map(x=>'<option '+(form.draftStage===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label><label class="field">Owner<input data-field="draftOwner" maxlength="100" value="'+h(form.draftOwner)+'"></label></div><label class="field">Editable discovery PRD · Markdown<textarea class="markdown-editor" data-field="draftText" rows="18" maxlength="200000">'+h(form.draftText)+'</textarea></label><p class="micro">Changing the stage records your judgment; the app does not certify validation. The original evidence and cohort remain attached.</p>';foot=btn("Close","close")+btn("Download Markdown","download-draft","download")+btn("Save draft","save-draft","save","primary");}
 if(modal==="export"){title="Export your research";body='<div class="export-options">'+btn("Selected reviews · CSV","export-csv","reviews")+btn("Executive cohort brief · Markdown","executive","files")+btn("Complete workspace backup · JSON","export-json","download")+'</div><p class="micro">Exports reflect the currently selected cohort. The full JSON backup contains all reviews and roadmap snapshots.</p>';}
 if(["empty","sample","restore"].includes(modal)){title=modal==="empty"?"Start an empty workspace?":modal==="sample"?"Reload the synthetic sample?":"Restore this backup?";body='<p>The current on-screen workspace will be replaced. Download a backup first. Save afterward to keep the replacement.</p>'+btn("Download current backup","backup","download")+(modal==="restore"?'<p>Backup: '+h(restore?.projectName)+' · '+restore?.reviews.length+' reviews</p>':"");foot=btn("Keep current","close")+btn("Replace workspace","replace","","primary");}

 return '<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">'+h(title)+'</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">'+icon("x",19)+'</button></div><div class="modal-body">'+body+'</div>'+(foot?'<div class="modal-foot">'+foot+'</div>':"")+'</section></div>';
}
function executive(){
 const rows=cohort(w,filters),m=metrics(rows),ops=opportunities(w,rows);
 return "# IntelSphere research brief\n\nGenerated: "+new Date().toISOString()+"\n\n"+
 "## Cohort\n"+JSON.stringify(filters)+"\nSelected reviews: "+rows.length+" / "+w.reviews.length+".\nData origin: "+provenance(rows)+".\n\n"+
 "## Sentiment\n"+Object.entries(m.sentiments).map(([k,v])=>"- "+k+": "+v).join("\n")+"\nNet sentiment: "+(m.netSentiment===null?"Not available":m.netSentiment.toFixed(1))+" (uncertain excluded).\nExplicit switch-intent phrases: "+m.switchCount+" reviews; not churn probability.\n\n"+
 "## Discovery opportunities\n"+ops.map(o=>"- "+o.title+": "+o.evidence.length+" supporting reviews; RICE "+o.score.toFixed(2)+"; evidence IDs "+o.evidence.map(r=>r.id).join(", ")).join("\n")+"\n\n"+
 "## Limits\nExperimental local sentiment model trained on 60 synthetic English examples. Themes and concern signals use rules. RICE reach is a review-count proxy; other inputs are analyst estimates. No real-time scraping, production churn prediction, verified feature absence, or measured time savings is claimed.\n";
}
async function save(){
 if(saveBusy)return;saveBusy=true;const snapshot=w;render();
 try{validateWorkspace(snapshot);if(JSON.stringify(snapshot).length>8000000)throw Error("Workspace exceeds the 8 MB save limit. Export a backup and start a smaller project.");
 if(storage==="Server"){const r=await fetch("/api/workspace",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({workspace:snapshot,revision})});const data=await r.json();if(!r.ok)throw Error(data.error||"Save failed.");revision=data.revision;}
 else{const existing=localStorage.getItem(KEY);if(existing&&JSON.parse(existing).revision!==revision)throw Error("A newer browser save exists. Export your changes, then reload before saving.");localStorage.setItem(KEY,JSON.stringify({workspace:snapshot,revision:revision+1}));revision++;storage="Browser";}
 if(snapshot===w)dirty=false;toast("Workspace saved · "+(storage==="Server"?"local SQLite":"this browser")+".");
 }catch(e){error=e.message+" Use a JSON export to keep an independent backup.";}finally{saveBusy=false;render();}
}
app.addEventListener("click",async e=>{
 const el=e.target.closest("button,[data-view]");if(!el||el.disabled)return;
 try{
 if(el.dataset.view){e.preventDefault?.();return navigate(el.dataset.view);}
 if(el.dataset.review){const r=w.reviews.find(r=>r.id===el.dataset.review);if(!r)throw Error("Review not found.");selectedReview=r.id;form.reviewSentiment=r.sentimentOverride||"";form.reviewNote=r.reviewNote;return openModal("review");}
 if(el.dataset.opportunity){const o=opportunities(w,cohort(w,filters)).find(x=>x.id===el.dataset.opportunity);if(!o)throw Error("Opportunity no longer matches this cohort.");selectedTheme=o.id;form.impact=o.inputs.impact;form.confidence=o.inputs.confidence;form.effort=o.inputs.effort;return openModal("opportunity");}
 if(el.dataset.themeFilter){filters.theme=el.dataset.themeFilter;return navigate("Review explorer");}
 if(el.dataset.draft){const s=w.roadmap.find(s=>s.id===el.dataset.draft);selectedDraft=s.id;form.draftText=s.text;form.draftStage=s.stage;form.draftOwner=s.owner;return openModal("draft");}
 if(el.dataset.downloadDraft){const s=w.roadmap.find(s=>s.id===el.dataset.downloadDraft);return download("IntelSphere_"+s.themeId+"_PRD.md",s.text,"text/markdown");}
 const a=el.dataset.action;
 if(a==="close")return closeModal();
 if(a==="dismiss-error"){error="";return render();}
 if(a==="save")return await save();
 if(a==="import"){form.text="";form.fileName="";return openModal("import");}
 if(["export","empty","sample"].includes(a))return openModal(a);
 if(a==="reset-filters"){filters={...EMPTY_FILTERS};page=0;return render();}
 if(a==="next"){page++;return render();}if(a==="previous"){page=Math.max(0,page-1);return render();}
 if(a==="confirm-import"){
 if(!form.text.trim())throw Error("Choose a file or paste CSV / JSON.");
 const raw=form.text.trim().replace(/^\uFEFF/,"");let records;
 if(raw.startsWith("[")||raw.startsWith("{")){const data=JSON.parse(raw);records=Array.isArray(data)?data:data.reviews;}else records=parseCSV(raw);
 const result=importRows(w,records,{competitor:form.competitor,platform:form.platform});importReport={accepted:result.accepted,duplicates:result.duplicates,errors:result.errors};modal=null;
 commit(result.workspace);navigate("Data sources");return toast(result.accepted+" reviews added · "+result.duplicates+" duplicates · "+result.errors.length+" rejected.");
 }
 if(a==="save-review"){page=0;const r=w.reviews.find(r=>r.id===selectedReview);if(!r)throw Error("Review missing.");modal=null;commit(audit({...w,reviews:w.reviews.map(x=>x.id===r.id?{...x,sentimentOverride:form.reviewSentiment||null,reviewNote:form.reviewNote.trim()}:x)},"Reviewed sentiment for "+r.id));return toast("Review judgment saved. Cohort metrics recalculated.");}
 if(a==="save-rice"||a==="add-roadmap"){
 const o=opportunities(w,cohort(w,filters)).find(o=>o.id===selectedTheme);if(!o)throw Error("Opportunity no longer matches this cohort.");
 const settings={impact:Number(form.impact),confidence:Number(form.confidence),effort:Number(form.effort)};riceScore({reach:o.evidence.length,...settings});
 let next=audit({...w,rice:{...w.rice,[o.id]:settings}},"Updated RICE assumptions for "+o.name);
 if(a==="add-roadmap"){const refreshed=opportunities(next,cohort(next,filters)).find(x=>x.id===o.id);next=addRoadmap(next,refreshed,filters);}
 modal=null;commit(next);if(a==="add-roadmap")navigate("Roadmap & PRD");return toast(a==="add-roadmap"?"Evidence-linked discovery brief created.":"Scoring assumptions updated.");
 }
 if(a==="save-draft"){const s=w.roadmap.find(s=>s.id===selectedDraft);if(!s)throw Error("Draft missing.");if(!form.draftText.trim())throw Error("The PRD cannot be empty.");modal=null;commit(audit({...w,roadmap:w.roadmap.map(x=>x.id===s.id?{...x,text:form.draftText,stage:form.draftStage,owner:form.draftOwner.trim(),updatedAt:new Date().toISOString()}:x)},"Edited discovery draft "+s.id));return toast("Draft saved on screen. Save workspace to persist it.");}
 if(a==="download-draft")return download("IntelSphere_PRD.md",form.draftText,"text/markdown");
 if(a==="export-json"||a==="backup"){download("IntelSphere_workspace.json",JSON.stringify(w,null,2),"application/json");if(a==="export-json")closeModal();return;}
 if(a==="export-csv"){download("IntelSphere_selected_reviews.csv",reviewCSV(cohort(w,filters)),"text/csv;charset=utf-8");if(modal==="export")closeModal();return;}
 if(a==="executive"){download("IntelSphere_Executive_Brief.md",executive(),"text/markdown");closeModal();return;}
 if(a==="template")return download("IntelSphere_import_template.csv",'text,competitor,platform,rating,date,source_id,url\n"Replace this with authorized review text","Your competitor","Review export",3,2026-10-29,review-001,\n',"text/csv");
 if(a==="sample-csv")return download("IntelSphere_synthetic_reviews.csv",reviewCSV(seed().reviews),"text/csv");
 if(a==="training")return download("IntelSphere_synthetic_training.json",JSON.stringify(TRAINING,null,2),"application/json");
 if(a==="import-report")return download("IntelSphere_import_report.json",JSON.stringify(importReport,null,2),"application/json");
 if(a==="replace"){let next=modal==="empty"?emptyWorkspace():modal==="sample"?seed():restore;validateWorkspace(next);modal=null;filters={...EMPTY_FILTERS};page=0;importReport=null;commit(audit(next,"Replaced the on-screen research workspace."));return navigate(w.reviews.length?"Overview":"Data sources");}
 if(a==="sandbox"){if(!form.sandbox.trim())throw Error("Paste review text first.");const p=predict(form.sandbox);const result=app.querySelector("#sandbox-result");if(result)result.innerHTML='<div class="sandbox-result">'+badge(p.label,sentimentTone(p.label))+'<p>Matched vocabulary: '+p.known+' / '+p.total+' features. Influential features: '+h(p.evidence.join(", ")||"Not enough known vocabulary")+'.</p><small>Experimental local model. No calibrated confidence or real-world accuracy claim.</small></div>';return;}
 }catch(err){error=err.message;render();if(modal)app.querySelector(".modal-body")?.insertAdjacentHTML("afterbegin",'<div class="alert error" role="alert">'+h(err.message)+'</div>');}
});
app.addEventListener("input",e=>{
 const el=e.target;
 if(el.dataset.field){form[el.dataset.field]=el.value;
 if(["impact","confidence","effort"].includes(el.dataset.field)){const o=opportunities(w,cohort(w,filters)).find(o=>o.id===selectedTheme);try{const score=riceScore({reach:o.evidence.length,impact:Number(form.impact),confidence:Number(form.confidence),effort:Number(form.effort)});const p=app.querySelector("#rice-preview");if(p)p.textContent="Score: "+score.toFixed(2);}catch{const p=app.querySelector("#rice-preview");if(p)p.textContent="Enter valid RICE assumptions.";}}}
 if(el.hasAttribute("data-query")){filters.query=el.value;page=0;const pos=el.selectionStart;render();const next=app.querySelector("[data-query]");next?.focus();next?.setSelectionRange(pos,pos);}
 if(el.hasAttribute("data-project-name")){w={...w,projectName:el.value};dirty=true;const label=app.querySelector("#save-label");if(label)label.textContent="Unsaved changes";}
});
app.addEventListener("change",async e=>{
 const el=e.target;try{
 if(el.dataset.filter){const previous=filters[el.dataset.filter];filters[el.dataset.filter]=el.value;if(filters.from&&filters.to&&filters.from>filters.to){filters[el.dataset.filter]=previous;throw Error("The start date must be before the end date.");}page=0;return render();}
 if(el.hasAttribute("data-import-file")){const f=el.files?.[0];if(!f)return;if(f.size>2000000||!/[.](csv|json)$/i.test(f.name))throw Error("Choose a CSV or JSON file under 2 MB.");form.text=await f.text();form.fileName=f.name;return render();}
 if(el.hasAttribute("data-restore")){const f=el.files?.[0];if(!f)return;if(f.size>8000000)throw Error("Backup exceeds 8 MB.");restore=validateWorkspace(JSON.parse(await f.text()));return openModal("restore");}
 }catch(err){error=err.message;render();if(modal)app.querySelector(".modal-body")?.insertAdjacentHTML("afterbegin",'<div class="alert error">'+h(err.message)+'</div>');}
});
app.addEventListener("mousedown",e=>{if(e.target.classList.contains("modal-backdrop"))closeModal();});
document.addEventListener("keydown",e=>{if(!modal)return;if(e.key==="Escape")return closeModal();if(e.key==="Tab"){const items=[...app.querySelectorAll('[role="dialog"] button:not(:disabled),[role="dialog"] input,[role="dialog"] select,[role="dialog"] textarea,[role="dialog"] a')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
window.addEventListener("storage",e=>{if(e.key===KEY){error="This workspace was saved in another tab. Export your changes and reload before saving.";render();}});
if(!globalThis.INTELSPHERE_STANDALONE){try{const response=await fetch("/api/workspace",{cache:"no-store"});if(response.ok){const data=await response.json();if(data.workspace)w=validateWorkspace(data.workspace);revision=data.revision;storage="Server";}else throw Error("No local server.");}catch{storage="Browser";}}

if(storage==="Browser"){try{const saved=localStorage.getItem(KEY);if(saved){const data=JSON.parse(saved);w=validateWorkspace(data.workspace);revision=data.revision;}}catch{storage="Memory";error="Browser storage is unavailable or its saved backup is invalid. Use JSON exports to keep work.";}}
render();



</script></body></html>
